# Single-server stack for a host that ALREADY runs nginx (ports 80/443 busy).
#
#   cp .env.server.example .env      # fill in the secrets and domains
#   docker compose -f docker-compose.nginx.yml up -d --build
#
# nginx proxies https://ppakuthm.com -> 127.0.0.1:8083 and
# https://ws.ppakuthm.com -> 127.0.0.1:8084. Nothing is exposed publicly except
# through nginx. See DEPLOY-SERVER.md ("existing nginx + certbot").

name: ppak

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL}
  APP_KEY: ${APP_KEY}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-ppak}
  DB_USERNAME: ${DB_USERNAME:-ppak}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_SSLMODE: prefer
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SESSION_SECURE_COOKIE: "true"
  BROADCAST_CONNECTION: reverb
  REVERB_HOST: reverb
  REVERB_PORT: "8082"
  REVERB_SCHEME: http
  MEDIA_DISK: attendance

x-app: &app
  build:
    context: .
    args:
      # Baked into the JS bundle. The browser reaches Reverb through nginx.
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
      VITE_REVERB_HOST: ${WS_DOMAIN}
      VITE_REVERB_PORT: "443"
      VITE_REVERB_SCHEME: https
  image: ppak-uthm-connect:server
  restart: unless-stopped
  env_file: .env
  environment:
    <<: *app-env
  volumes:
    - storage_app:/var/www/html/storage/app
    - storage_logs:/var/www/html/storage/logs

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      postgres:
        condition: service_healthy
      reverb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=60"]
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
      reverb:
        condition: service_started

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
      reverb:
        condition: service_started

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8082"]
    ports:
      - "127.0.0.1:8084:8082"
    environment:
      <<: *app-env
      REVERB_HOST: localhost
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ppak}
      POSTGRES_USER: ${DB_USERNAME:-ppak}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ppak} -d ${DB_DATABASE:-ppak}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  storage_app:
  storage_logs:
