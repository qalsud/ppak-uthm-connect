# PPAK UTHM Connect — nginx site for a server that already runs nginx + certbot.
#
# Install:
#   sudo cp docker/nginx/ppakuthm.com.conf /etc/nginx/sites-available/ppakuthm.com.conf
#   sudo ln -s /etc/nginx/sites-available/ppakuthm.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ppakuthm.com -d www.ppakuthm.com -d ws.ppakuthm.com
#
# The app listens on 127.0.0.1:8083, Reverb on 127.0.0.1:8084 (see
# docker-compose.nginx.yml). Certbot adds the TLS server blocks and the
# HTTP -> HTTPS redirect after the initial reload.

server {
    listen 80;
    listen [::]:80;
    server_name ppakuthm.com www.ppakuthm.com;

    # The app accepts up to 10 MB per image and 3 chat attachments.
    client_max_body_size 40m;

    # Inertia preload hints for the Vite chunks can exceed nginx's 4-8 KB
    # default header buffer (students/teachers/parents/payments).
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ws.ppakuthm.com;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets stay open for long-lived chat sessions.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
