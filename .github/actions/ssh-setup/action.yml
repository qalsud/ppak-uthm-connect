name: Set up deploy SSH
description: Write the production deploy key and known_hosts into the runner's SSH directory.

inputs:
  private_key:
    description: Private key for the deploy user
    required: true
  known_hosts:
    description: Pinned SSH host key for the production server
    required: true

runs:
  using: composite
  steps:
    - name: Write SSH key and known_hosts
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.private_key }}
        SSH_KNOWN_HOSTS: ${{ inputs.known_hosts }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
