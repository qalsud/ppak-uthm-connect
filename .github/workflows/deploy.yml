name: Deploy production

on:
  # Run after the CI workflow finishes for a push to main. The job below only
  # deploys when AUTO_DEPLOY=true, so setup can be tested with the manual button.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Optional commit SHA to deploy (leave blank for origin/main)'
        required: false
        type: string

concurrency:
  group: production-operations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ppakuthm.com
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_DEPLOY == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        uses: ./.github/actions/ssh-setup
        with:
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "deploy ${TARGET_SHA}"
