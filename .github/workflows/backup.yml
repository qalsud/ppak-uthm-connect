name: Backup production

on:
  schedule:
    # 19:00 UTC = 03:00 MYT. GitHub may delay scheduled jobs by a few minutes.
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: production-operations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Back up database and photos
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        uses: ./.github/actions/ssh-setup
        with:
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Run backup over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" backup
