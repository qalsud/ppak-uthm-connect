services:
  mysql:
    image: mysql:8.4
    container_name: ppak_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ppak_uthm
      MYSQL_USER: ppak_uthm
      MYSQL_PASSWORD: ppak_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ppak_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root_secret
    ports:
      - "8080:80"

  redis:
    image: redis:7-alpine
    container_name: ppak_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: